# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = %(here)s/alembic

# template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value, default is None (local time)
timezone = UTC

# version location specification; This defaults
# to alembic/versions.
version_locations = %(here)s/alembic/versions

# the sys.path prepend, default is current working dir
prepend_sys_path = .

# version path separator; as mentioned above, this defaults to the
# system's default path separator, but can be hardcoded here.
version_path_separator = os

# sqlalchemy.url is loaded dynamically in env.py from app.core.config.settings

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
